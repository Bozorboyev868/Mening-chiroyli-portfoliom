<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JAHONGIR.B</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:#070b17;color:#fff;font-family:Outfit,system-ui,sans-serif;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);z-index:0;pointer-events:none}
body::before{left:-25vmax;top:-10vmax;background:radial-gradient(#10306a,transparent 65%);opacity:.7}
body::after{right:-25vmax;bottom:-20vmax;background:radial-gradient(#4a1a6e,transparent 65%);opacity:.7}
.card{position:relative;z-index:1;width:100%;max-width:548px;padding:34px 36px 40px;border-radius:44px;background:#0d111d;text-align:center}
.card::before,.card::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:3px;background:conic-gradient(from var(--a),#ff1f5a,#ffb400,#19e65a,#00d4ff,#7a3cff,#ff1f5a);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 6s linear infinite;pointer-events:none}
.card::after{inset:-2px;filter:blur(18px);opacity:.55;padding:10px;z-index:-1}
@keyframes spin{to{--a:360deg}}
.tools{position:relative;z-index:2;display:flex;justify-content:flex-end;gap:14px}
.tools button{width:46px;height:46px;border-radius:50%;border:1px solid #2a3040;background:#1a1f2c;color:#9aa3b5;cursor:pointer;display:grid;place-items:center}
.tools button:hover{color:#fff}
.avatar{width:140px;height:140px;margin:6px auto 0;border-radius:50%;border:2px solid #3a3f55;box-shadow:0 0 30px #5b2bd488;overflow:hidden;background:#1a1f2c}
h1{margin:34px 0 36px;font-size:34px;letter-spacing:-.5px;display:flex;justify-content:center;align-items:center;gap:10px}
h1 i{color:#a855f7;font-size:18px;font-style:normal}
.links{display:flex;flex-direction:column;gap:18px}
.link{position:relative;z-index:2;display:flex;align-items:center;gap:16px;padding:16px 22px;border-radius:26px;border:1px solid #262c3b;background:#151a27;color:#fff;text-decoration:none;font-weight:600;font-size:21px;transition:transform .2s,background .2s}
.link:first-child{background:linear-gradient(90deg,#1e2230,#2a2e3b)}
.link:hover{transform:translateY(-2px);background:#202638}
.link .ic{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;flex:none;font-size:34px}
.link span.t{flex:1;text-align:left}
.link .ar{color:#8a93a6}
.foot{margin-top:40px;color:#566077;font-size:17px;letter-spacing:.3px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(80px);background:#1f2433;border:1px solid #333a4d;padding:12px 20px;border-radius:14px;transition:.3s;z-index:5}
.toast.on{transform:translateX(-50%)}
@media(max-width:480px){.card{padding:26px 20px 32px;border-radius:36px}h1{font-size:28px}.link{font-size:18px;padding:12px 16px}.link .ic{width:52px;height:52px}}
</style>
</head>
<body>
<main class="card">

  </div>

<script>
const t=document.getElementById('toast');
function say(m){t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2000)}
document.getElementById('share').onclick=async()=>{
  try{
    if(navigator.share){await navigator.share({title:document.title,url:location.href});return}
    await navigator.clipboard.writeText(location.href);say('Havola nusxalandi')
  }catch(e){say('Ulashib bo\'lmadi')}
};
document.getElementById('qr').onclick=()=>say('QR tez orada qo\'shiladi');
